# A.R.D.A. gate — core file generated by daeron-core: do not edit here.
# Make the "arda-gate" check required in the branch protection of main.
name: arda-gate
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  arda-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pyyaml
      - name: Spec gate (Principle 0)
        run: python .arda/tools/arda_ci.py gate
      - name: Secret scan
        run: python .arda/tools/arda_ci.py secrets
      - name: Manifest drift
        run: python .arda/tools/arda_ci.py manifest
      - name: Project checks
        run: python .arda/tools/arda_ci.py checks
